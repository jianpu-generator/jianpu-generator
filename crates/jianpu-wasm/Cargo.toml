[package]
name = "jianpu-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["midi", "wav", "mp3", "pdf"]
midi = ["jianpu-generator/midi"]
wav = ["midi", "jianpu-generator/wav"]
mp3 = ["wav", "jianpu-generator/mp3"]
pdf = ["jianpu-generator/pdf"]

[dependencies]
jianpu-generator = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
wit-bindgen = "0.44.0"
itertools = "0.13"
brotli = "8"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[package.metadata.component]
package = "jianpu:wasm"

[package.metadata.component.target]
path = "wit"

# NOTE: deliberately NOT `[lints]\nworkspace = true` here (cargo forbids
# combining `workspace = true` with a local `[lints.*]` table in the same
# manifest). The root workspace forbids unsafe code (`unsafe_code =
# "forbid"`) and denies unreachable_pub/unused_qualifications, but
# wit-bindgen's `export!`/`generate!` macros expand to `unsafe extern "C"`
# functions with explicit `#[export_name = ...]` and code that trips
# unreachable_pub -- a hard conflict, not a style nit, since `forbid` cannot
# be overridden at a finer grain than the whole lint once inherited. So this
# crate copies the workspace clippy lints verbatim but relaxes just the
# three rustc lints that wit-bindgen's generated code violates. See
# PLAN-wit-bindgen-migration.md's "Resolved risks" section.
[lints.rust]
unsafe_code = "allow"
unreachable_pub = "allow"
unused_qualifications = "allow"
dead_code = "deny"
unused_variables = "deny"
unused_imports = "deny"
unused_must_use = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_macros = "deny"
mem_forget = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
exit = "deny"
len_zero = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
uninlined_format_args = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
match_wildcard_for_single_variants = "deny"
indexing_slicing = "deny"
no_effect_underscore_binding = "deny"
let_underscore_untyped = "deny"
