[workspace]
members = [".", "crates/jianpu-wasm", "tools/dead-pub-check"]
resolver = "2"

[patch.crates-io]
# `rusty_mp3` 0.7.0's stage profiler calls `std::time::Instant::now()`
# unconditionally on every encode/decode step, which panics at runtime on
# wasm32-unknown-unknown (no time source there). Vendored copy with the
# profiler cfg-gated to skip timing on wasm32 instead of aborting.
# See vendor/rusty_mp3/src/{encode,decode}/mod.rs.
rusty_mp3 = { path = "vendor/rusty_mp3" }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
dead_code = "deny"
unused_variables = "deny"
unused_imports = "deny"
unused_must_use = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
# Hard-block common AI-agent shortcuts and stub code.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_macros = "deny"
mem_forget = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"

wildcard_imports = "deny"
exit = "deny"
len_zero = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
uninlined_format_args = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
match_wildcard_for_single_variants = "deny"
indexing_slicing = "deny"
no_effect_underscore_binding = "deny"
let_underscore_untyped = "deny"

[profile.release]
debug = true

# `cargo component build --release` otherwise inherits the plain `release`
# profile above, whose `debug = true` (kept for native CLI debugging) makes
# the component build enormous (~140 MiB vs. wasm-pack's ~7 MiB) since wasm
# builds carry no equivalent post-processing strip step by default. Scoped
# to just the wasm/component build via `--profile release-wasm` so the
# native `release` profile (and wasm-pack's own build, which still uses
# plain `release`) are unaffected.
[profile.release-wasm]
inherits = "release"
debug = false
strip = true

[package]
name = "jianpu-generator"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "jianpu"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "pdf", "midi", "wav", "mp3"]
pdf = ["dep:svg2pdf", "dep:pdf-writer", "dep:zip"]
midi = ["dep:midly", "dep:zip"]
wav = ["midi", "dep:oxisynth", "dep:hound"]
mp3 = ["wav", "dep:rusty_mp3"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ariadne = "0.6"
itertools = "0.13"
nonempty = "0.10"
clap = { version = "4", features = ["derive"], optional = true }
svg2pdf = { version = "0.12", optional = true }
pdf-writer = { version = "0.12", optional = true }
midly = { version = "0.5", optional = true }
oxisynth = { version = "0.0.5", optional = true }
hound = { version = "3", optional = true }
rusty_mp3 = { version = "0.7", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
base64 = "0.22"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
cucumber = "0.23.0"
quickcheck = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "cucumber"
harness = false

[[test]]
name = "format_score_cucumber"
harness = false

[[test]]
name = "lyric_hover_box_height_cucumber"
harness = false

[[test]]
name = "text_style_metadata_cucumber"
harness = false

[[test]]
name = "text_style_rendering_cucumber"
harness = false

[[test]]
name = "text_style_bold_italic_underline_cucumber"
harness = false

[[test]]
name = "sequence_intro_key_context_cucumber"
harness = false

[lints]
workspace = true
