pre-commit:
  piped: true
  only:
    - ref: master
  jobs:
    # All other checks run in parallel first; e2e-tests (the slowest job) only
    # runs afterwards, once everything else has already passed. Piping this
    # group also keeps web-typecheck and e2e-tests sequential relative to each
    # other, since both invoke `pnpm run build:wasm` and would otherwise race
    # wasm-pack/wasm-bindgen on their shared cache.
    - group:
        parallel: true
        jobs:
          - name: file-quality
            # prek runs .pre-commit-config.yaml's builtin checks against staged files
            run: prek run

          - name: check-max-file-lines
            glob: "**/*.{rs,ts,tsx,js,jsx,py,css,html}"
            exclude: "(crates/jianpu-wasm/pkg/|target/)"
            run: python3 scripts/check-max-file-lines.py {staged_files}

          - name: cargo-fmt
            glob: "**/*.rs"
            run: cargo fmt -- --check

          - name: cargo-checks
            glob: "{**/*.rs,demo/**}"
            run: cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace

          - name: dead-pub-check
            glob: "{src/**,crates/jianpu-wasm/src/**,tests/**}"
            run: cargo run -p dead-pub-check --quiet

          - name: syntax-md-examples
            glob: "{syntax.md,src/parser/**,src/desugar.rs}"
            run: python3 scripts/check-syntax-md-examples.py

          - name: biome-check
            glob: "web/**"
            run: cd web && pnpm exec biome check .

          - name: web-typecheck
            glob: "{crates/jianpu-wasm/**,web/**}"
            run: cd web && pnpm run build:wasm && python3 ../scripts/check-wasm-size.py && pnpm exec tsc -b

    - name: e2e-tests
      glob: "{web/src/**,web/e2e/**,crates/**,src/**}"
      run: cd web && pnpm build:wasm && pnpm test:e2e

pre-merge-commit:
  jobs:
    - name: e2e-tests
      only:
        - ref: master
      run: cd web && pnpm build:wasm && pnpm test:e2e
