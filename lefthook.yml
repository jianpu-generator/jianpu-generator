pre-commit:
  piped: true
  only:
    - ref: master
  jobs:
    # Auto-fixing jobs run first, sequentially, and re-stage whatever they
    # change (stage_fixed). They must fully settle before the parallel
    # validation group below starts, since some of those jobs (e.g.
    # cargo-checks) read/compile the same files these jobs rewrite.
    - name: file-quality
      # prek runs .pre-commit-config.yaml's builtin checks against staged
      # files; its builtin hooks (trailing-whitespace, end-of-file-fixer,
      # mixed-line-ending) fix in place rather than just reporting.
      run: prek run
      stage_fixed: true

    - name: cargo-fmt
      glob: "**/*.rs"
      run: cargo fmt
      stage_fixed: true

    - name: biome-check
      glob: "web/**"
      run: cd web && pnpm exec biome check --write .
      stage_fixed: true

    # All other checks run in parallel first; e2e-tests (the slowest job) only
    # runs afterwards, once everything else has already passed. web-typecheck
    # is deliberately kept out of this group (and run sequentially below,
    # before e2e-tests) because it invokes `pnpm run build:wasm`, which runs
    # wasm-pack's own `cargo install wasm-bindgen-cli` — that races
    # cargo-checks (and would race e2e-tests) for the shared Cargo
    # package-cache lock and corrupts wasm-pack's install-tracking JSON.
    - group:
        parallel: true
        jobs:
          - name: check-max-file-lines
            glob: "**/*.{rs,ts,tsx,js,jsx,py,css,html}"
            exclude:
              - "crates/jianpu-wasm/pkg/**"
              - "target/**"
              - "vendor/**"
            run: python3 scripts/check-max-file-lines.py {staged_files}

          - name: cargo-checks
            glob: "{**/*.rs,demo/**}"
            run: cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace

          - name: dead-pub-check
            glob: "{src/**,crates/jianpu-wasm/src/**,tests/**}"
            run: cargo run -p dead-pub-check --quiet

          - name: syntax-md-examples
            glob: "{syntax.md,src/parser/**,src/desugar.rs}"
            run: python3 scripts/check-syntax-md-examples.py

          - name: web-unit-tests
            glob: "web/**"
            run: cd web && pnpm run test:unit

          - name: ast-grep-check
            glob: "web/src/**"
            run: cd web && pnpm run lint:ast-grep

    - name: web-typecheck
      glob: "{crates/jianpu-wasm/**,web/**}"
      run: cd web && pnpm run build:wasm && python3 ../scripts/check-wasm-size.py && pnpm exec tsc -b

    - name: e2e-tests
      glob: "{web/src/**,web/e2e/**,crates/**,src/**}"
      run: cd web && pnpm build:wasm && pnpm test:e2e

pre-merge-commit:
  jobs:
    - name: e2e-tests
      only:
        - ref: master
      run: cd web && pnpm build:wasm && pnpm test:e2e
