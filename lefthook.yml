pre-commit:
  parallel: true
  commands:
    file-quality:
      # prek runs .pre-commit-config.yaml's builtin checks against staged files
      run: prek run

    check-max-file-lines:
      glob: "**/*.{rs,ts,tsx,js,jsx,py,css,html}"
      exclude: "(crates/jianpu-wasm/pkg/|target/)"
      run: python3 scripts/check-max-file-lines.py {staged_files}

    cargo-fmt:
      glob: "**/*.rs"
      run: cargo fmt -- --check

    cargo-checks:
      glob: "**/*.rs"
      run: cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace

    biome-check:
      glob: "web/**"
      run: cd web && pnpm exec biome check .

    web-typecheck:
      glob: "{crates/jianpu-wasm/**,web/**}"
      run: cd web && pnpm run build:wasm && pnpm exec tsc -b
