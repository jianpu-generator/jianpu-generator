pre-commit:
  parallel: true
  only:
    - ref: master
  jobs:
    - name: file-quality
      # prek runs .pre-commit-config.yaml's builtin checks against staged files
      run: prek run

    - name: check-max-file-lines
      glob: "**/*.{rs,ts,tsx,js,jsx,py,css,html}"
      exclude: "(crates/jianpu-wasm/pkg/|target/)"
      run: python3 scripts/check-max-file-lines.py {staged_files}

    - name: cargo-fmt
      glob: "**/*.rs"
      run: cargo fmt -- --check

    - name: cargo-checks
      glob: "{**/*.rs,demo/**}"
      run: cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace

    - name: syntax-md-examples
      glob: "{syntax.md,src/parser/**,src/desugar.rs}"
      run: python3 scripts/check-syntax-md-examples.py

    - name: biome-check
      glob: "web/**"
      run: cd web && pnpm exec biome check .

    # web-typecheck and e2e-tests both invoke `pnpm run build:wasm`; running them
    # in parallel makes wasm-pack/wasm-bindgen race on their shared cache. Piping
    # this group forces them to run sequentially so only one build runs at a time.
    - group:
        piped: true
        jobs:
          - name: web-typecheck
            glob: "{crates/jianpu-wasm/**,web/**}"
            run: cd web && pnpm run build:wasm && pnpm exec tsc -b

          - name: e2e-tests
            glob: "{web/src/**,web/e2e/**,crates/**,src/**}"
            run: cd web && pnpm build:wasm && pnpm test:e2e

pre-merge-commit:
  jobs:
    - name: e2e-tests
      only:
        - ref: master
      run: cd web && pnpm build:wasm && pnpm test:e2e
