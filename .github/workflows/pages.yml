name: Deploy web to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-component

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web
        env:
          VITE_BASE_PATH: /jianpu-generator/
          # The OAuth App's client ID. Not a secret (GitHub's device flow
          # sends it in plaintext). Replace with the real OAuth App's client
          # ID for clarity/future-proofing once one is registered.
          VITE_GITHUB_OAUTH_CLIENT_ID: placeholder-client-id
          # Dedicated Synced Share sign-in OAuth App's client id -- not a
          # placeholder like the one above, since the browser sends this
          # directly to GitHub's authorization endpoint (see
          # `useSyncedShareOwner.ts`). Separate app from the storage one
          # above so GitHub's consent screen never surfaces the storage
          # app's broad `repo` grant on this identity-only sign-in. Not a
          # secret.
          VITE_SYNCED_SHARE_GITHUB_OAUTH_CLIENT_ID: Ov23liFN0gIJmZ2VREGm
          # Cloudflare Worker host for Synced Share. Not a
          # secret (exposed client-side regardless), but only ever set in
          # the gitignored `web/.env.local` for local dev, so it's absent
          # here unless declared explicitly.
          VITE_SYNCED_SHARE_HOST: jianpu-live-share-worker-rs.hou32hou.workers.dev
        run: pnpm build

      - name: Add SPA-fallback 404.html
        # GitHub Pages is a static file host with no server-side routing: a
        # real top-level navigation to a path with no file on disk (e.g.
        # GitHub's own OAuth redirect landing on
        # /synced-share/github-callback) gets GitHub Pages' generic 404, and
        # the app's JS (and thus its client-side router) never loads at all.
        # Copying the *built* index.html (with its real, hashed asset
        # references) to 404.html is GitHub Pages' standard SPA workaround:
        # it serves this file (HTTP 404 status, content unaffected) for any
        # unmatched path, so the app's JS loads and can render the right
        # route client-side. Must be the built file, not a static
        # `public/404.html` -- only the built one has the correct hashed
        # `<script>`/`<link>` tags. Cloudflare Pages (`deploy-cloudflare`
        # below) does NOT need this: it already falls back to `index.html`
        # with a `200` for any unmatched path as long as no top-level
        # `404.html` exists.
        run: cp web/dist/index.html web/dist/404.html

      - name: Add .nojekyll
        run: touch web/dist/.nojekyll

      - name: Install Playwright Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify GitHub callback route resolves under the GitHub Pages base path
        working-directory: web
        run: |
          pnpm exec bddgen --config=playwright.pages.config.ts
          pnpm exec playwright test --config=playwright.pages.config.ts

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  deploy-cloudflare:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://jianpu-generator.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-component

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Rebuilt separately from the GitHub Pages `build` job above because
      # Cloudflare Pages serves from the domain root, so this needs
      # VITE_BASE_PATH=/ baked in rather than /jianpu-generator/.
      - name: Build
        working-directory: web
        env:
          VITE_BASE_PATH: /
          VITE_GITHUB_OAUTH_CLIENT_ID: placeholder-client-id
          VITE_SYNCED_SHARE_GITHUB_OAUTH_CLIENT_ID: Ov23liFN0gIJmZ2VREGm
          VITE_SYNCED_SHARE_HOST: jianpu-live-share-worker-rs.hou32hou.workers.dev
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=jianpu-generator --branch=master
