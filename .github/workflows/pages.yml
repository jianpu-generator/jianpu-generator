name: Deploy web (Poentaro, plus the bridge on the old origins)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # GitHub Pages (`/jianpu-generator/`) is one of the app's old origins. It
  # now serves only a static page that redirects every link to the same one
  # on `poentaro.pages.dev` (`web/github-pages-redirect/index.html`); saved
  # files are carried over only from the old Cloudflare origin (see "Origin
  # migration" in ARCHITECTURE.md). Waits for the app's own deploy so it
  # never redirects to a site that isn't up yet.
  build:
    needs: deploy-cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Serve the redirect for every path
        # GitHub Pages serves a top-level `404.html` for any path with no
        # file on disk, so the copy makes every old link reach the redirect.
        run: |
          cp web/github-pages-redirect/index.html web/github-pages-redirect/404.html
          touch web/github-pages-redirect/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/github-pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  deploy-cloudflare:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://poentaro.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: rust node pnpm cargo-binstall cargo:cargo-component

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web
        env:
          VITE_BASE_PATH: /
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=poentaro --branch=master

  # The app's old Cloudflare Pages project (`jianpu-generator.pages.dev`)
  # now serves only the bridge page. Cloudflare Pages falls back to
  # `index.html` for every path, so no `404.html` is needed. Deployed from
  # `web/` like the app, so `web/functions/` goes along and old `?s=` links
  # keep their share's link-preview title. Waits for the app's deploy, like `build`.
  deploy-cloudflare-bridge:
    needs: deploy-cloudflare
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages-bridge
      url: https://jianpu-generator.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: rust node pnpm

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build the bridge page
        working-directory: web
        env:
          VITE_BASE_PATH: /
        run: pnpm build:bridge

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist-bridge --project-name=jianpu-generator --branch=master
