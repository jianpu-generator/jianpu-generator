name: Deploy web to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web
        env:
          VITE_BASE_PATH: /jianpu-generator/
          # Deployed URL of the step-1 Cloudflare Pages OAuth proxy
          # (`cf-oauth-proxy/`), which relays the two GitHub device-flow
          # calls that don't send CORS headers. Placeholder below — replace
          # with the real project URL once that Cloudflare Pages project is
          # deployed (see `cf-oauth-proxy/README.md`).
          VITE_GITHUB_OAUTH_PROXY_URL: https://jianpu-oauth-proxy.pages.dev
          # The OAuth App's client ID. Not a secret (GitHub's device flow
          # sends it in plaintext), but functionally unused by the proxy
          # above, which injects the real `GITHUB_CLIENT_ID` server-side
          # regardless of what's sent here — required only because
          # `@octokit/auth-oauth-device` needs a non-empty `clientId` to
          # construct its requests. Replace with the real OAuth App's client
          # ID for clarity/future-proofing once one is registered.
          VITE_GITHUB_OAUTH_CLIENT_ID: placeholder-client-id
        run: pnpm build

      - name: Add .nojekyll
        run: touch web/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
