name: Deploy web (Poentaro, plus the bridge on the old origins)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # GitHub Pages (`wongjiahau.github.io/jianpu-generator/`) is one of the
  # app's old origins: it now serves the bridge page that hands the
  # browser's saved data to `poentaro.pages.dev` and redirects there (see
  # "Origin migration" in ARCHITECTURE.md). Waits for the app's own deploy so
  # the bridge never redirects to a site that isn't up yet.
  build:
    needs: deploy-cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: rust node pnpm

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build the bridge page
        working-directory: web
        env:
          VITE_BASE_PATH: /jianpu-generator/
          # The Synced Share worker's host comes from its
          # `cloudflare.config.ts` (see `web/vite.config.ts`), not from here.
        run: pnpm build:bridge

      - name: Serve the bridge for every path
        # GitHub Pages is a static file host with no server-side routing: a
        # path with no file on disk gets the generic 404 page. GitHub Pages
        # serves a top-level `404.html` for any unmatched path instead, so a
        # copy of the built bridge page (with its hashed asset tags) makes
        # every old link reach the bridge, which keeps the path, query and
        # fragment when it redirects.
        run: cp web/dist-bridge/index.html web/dist-bridge/404.html

      - name: Add .nojekyll
        run: touch web/dist-bridge/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-bridge

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  deploy-cloudflare:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://poentaro.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: rust node pnpm cargo-binstall cargo:cargo-component

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web
        env:
          VITE_BASE_PATH: /
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=poentaro --branch=master

  # The app's old Cloudflare Pages project (`jianpu-generator.pages.dev`)
  # now serves only the bridge page (see the GitHub Pages `build` job
  # above). Cloudflare Pages falls back to `index.html` for every path, so no
  # `404.html` is needed. Deployed from `web/` like the app, so
  # `web/functions/` goes along and old `?s=` links keep their share's
  # link-preview title. Waits for the app's deploy, like `build`.
  deploy-cloudflare-bridge:
    needs: deploy-cloudflare
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages-bridge
      url: https://jianpu-generator.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: rust node pnpm

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build the bridge page
        working-directory: web
        env:
          VITE_BASE_PATH: /
        run: pnpm build:bridge

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist-bridge --project-name=jianpu-generator --branch=master
