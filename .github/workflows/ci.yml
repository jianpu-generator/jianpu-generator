name: CI

# Mirrors every job in `lefthook.yml`'s pre-commit pipeline, so a PR gets the
# same gate a local commit on master does. Auto-fixing jobs (prek, cargo fmt,
# biome) run here in check-only mode.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  file-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: j178/prek-action@v1
        with:
          extra-args: --all-files

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: cargo-fmt
        run: cargo fmt --all --check

      - name: cargo-checks
        run: cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace

      - name: dead-pub-check
        run: cargo run -p dead-pub-check --quiet

      - name: live-share-worker-wasm-check
        run: cargo check --target wasm32-unknown-unknown -p live-share-worker

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check-max-file-lines
        run: git ls-files '*.rs' '*.ts' '*.tsx' '*.js' '*.jsx' '*.py' '*.css' '*.html' | grep -v -e '^crates/jianpu-wasm/pkg/' -e '^target/' -e '^vendor/' | xargs python3 scripts/check-max-file-lines.py

      - name: syntax-md-examples
        run: python3 scripts/check-syntax-md-examples.py

  sqruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: taiki-e/install-action@v2
        with:
          tool: sqruff@0.29.3
      - name: sqruff
        run: |
          files=$(git ls-files 'live-share-worker/migrations/**/*.sql' 'crates/live-share-worker/queries/**/*.sql')
          if [ -n "$files" ]; then sqruff lint $files; fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-component

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: biome-check
        working-directory: web
        run: pnpm exec biome check .

      - name: build-wasm-component
        working-directory: web
        run: pnpm run build:wasm-component

      - name: build-worker-types
        working-directory: web
        run: pnpm run build:worker-types

      - name: web-unit-tests
        working-directory: web
        run: pnpm run test:unit

      - name: ast-grep-check
        working-directory: web
        run: pnpm run lint:ast-grep

      - name: web-typecheck
        working-directory: web
        run: pnpm run build:wasm-component && pnpm run build:worker-types && python3 ../scripts/check-wasm-size.py && pnpm exec tsc -b

  e2e:
    needs: [rust, scripts, web]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-component

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install live-share-worker dependencies
        working-directory: crates/live-share-worker
        run: pnpm install --frozen-lockfile

      # Pre-build so the e2e web server's `cf dev` (whose build step is
      # `cargo install worker-build && worker-build --release`) only does an
      # incremental build within Playwright's startup timeout.
      - name: Build live-share-worker
        working-directory: crates/live-share-worker
        run: cargo install worker-build --version 0.8.6 --locked && worker-build --release

      - name: Install Playwright Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: debug-cf-dev
        working-directory: crates/live-share-worker
        continue-on-error: true
        run: |
          D=$(node -p "require('./deploy.json').d1DatabaseId")
          (bash -c "pnpm exec cf d1 migrations apply $D --local --dir ../../live-share-worker/migrations --persist-to .wrangler/e2e-state < /dev/null && pnpm exec cf dev --port 8797 --persist-to .wrangler/e2e-state" > /tmp/chain.log 2>&1 &)
          for i in $(seq 1 24); do curl -s -o /dev/null -w "%{http_code}\n" localhost:8797/health && break; sleep 5; done
          ps aux | grep -E "cf|wrangler|workerd" | grep -v grep | cut -c1-200
          tail -40 /tmp/chain.log

      - name: e2e-tests
        working-directory: web
        run: pnpm build:wasm-component && pnpm build:worker-types && pnpm test:e2e:resolve
