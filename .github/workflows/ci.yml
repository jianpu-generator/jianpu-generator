name: CI

# Mirrors every job in `lefthook.yml`'s pre-commit pipeline, so a PR gets the
# same gate a local commit on master does. Auto-fixing jobs (prek, cargo fmt,
# biome) run here in check-only mode.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  file-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: j178/prek-action@v1
        with:
          extra-args: --all-files

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2

      - name: cargo-fmt
        run: cargo fmt --all --check

      - name: cargo-checks
        run: cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace

      - name: dead-pub-check
        run: cargo run -p dead-pub-check --quiet

      - name: live-share-worker-wasm-check
        run: cargo check --target wasm32-unknown-unknown -p live-share-worker

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check-max-file-lines
        run: git ls-files '*.rs' '*.ts' '*.tsx' '*.js' '*.jsx' '*.py' '*.css' '*.html' | grep -v -e '^crates/poentaro-wasm/pkg/' -e '^target/' -e '^vendor/' | xargs python3 scripts/check-max-file-lines.py

      - name: syntax-md-examples
        run: python3 scripts/check-syntax-md-examples.py

  sqruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: github:quarylabs/sqruff
      - name: sqruff
        run: |
          files=$(git ls-files 'live-share-worker/migrations/**/*.sql' 'crates/live-share-worker/queries/**/*.sql')
          if [ -n "$files" ]; then sqruff lint $files; fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - uses: jdx/mise-action@v2
        with:
          install_args: rust node pnpm cargo-binstall cargo:cargo-component
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: biome-check
        working-directory: web
        run: pnpm exec biome check .

      - name: build-wasm-component
        working-directory: web
        run: pnpm run build:wasm-component

      - name: build-worker-types
        working-directory: web
        run: pnpm run build:worker-types

      - name: web-unit-tests
        working-directory: web
        run: pnpm run test:unit

      - name: ast-grep-check
        working-directory: web
        run: pnpm run lint:ast-grep

      - name: web-typecheck
        working-directory: web
        run: pnpm run build:wasm-component && pnpm run build:worker-types && python3 ../scripts/check-wasm-size.py && pnpm exec tsc -b

  # Builds the live-share-worker once and saves the cargo cache, so each e2e
  # shard below restores a warm build instead of compiling it from scratch.
  build-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: rust node pnpm cargo-binstall cargo:worker-build
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-worker
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install live-share-worker dependencies
        working-directory: crates/live-share-worker
        run: pnpm install --frozen-lockfile
      - name: Build live-share-worker
        working-directory: crates/live-share-worker
        run: worker-build --release
      - uses: actions/upload-artifact@v4
        with:
          name: live-share-worker-build
          path: crates/live-share-worker/build
          if-no-files-found: error

  e2e:
    needs: [rust, scripts, web, build-worker]
    name: e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - uses: jdx/mise-action@v2
        with:
          install_args: rust node pnpm cargo-binstall cargo:cargo-component
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install live-share-worker dependencies
        working-directory: crates/live-share-worker
        run: pnpm install --frozen-lockfile

      # Prebuilt by the `build-worker` job; `PREBUILT_WORKER` (set on the e2e
      # step below) makes `cf dev`'s build command a no-op.
      - uses: actions/download-artifact@v4
        with:
          name: live-share-worker-build
          path: crates/live-share-worker/build

      # Browser binaries are cached; system deps (apt) can't be, so a cache hit
      # only runs `install-deps`.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: pnpm exec playwright install-deps chromium

      # Applied ahead of Playwright's web server so a slow or hung
      # `cf d1 migrations apply` fails here, with its own log, rather than
      # inside the web server's timeout (the script bounds and retries it).
      - name: Apply e2e migrations
        working-directory: crates/live-share-worker
        run: scripts/apply-local-migrations.sh

      - name: e2e-tests
        working-directory: web
        env:
          PREBUILT_WORKER: '1'
        run: pnpm build:wasm-component && pnpm build:worker-types && pnpm test:e2e:resolve -- --shard=${{ matrix.shard }}/4
