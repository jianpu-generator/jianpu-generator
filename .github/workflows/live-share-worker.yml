name: Deploy Synced Share worker

# Deploys the Rust/D1 rewrite of the Synced Share worker
# (`crates/live-share-worker/`), replacing the old TypeScript/KV worker's
# now-deleted deploy pipeline (formerly `live-share-worker/`, see
# TODO-synced-share-rust-d1-migration.md task 11).
#
# Prerequisite not handled by this pipeline (TODO §7 / task 12): a deploy
# here will succeed, but GitHub sign-in stays broken until, once, by hand:
#   `SYNCED_SHARE_GITHUB_CLIENT_SECRET` is set via
#   `pnpm exec wrangler secret put SYNCED_SHARE_GITHUB_CLIENT_SECRET` from
#   `crates/live-share-worker/` (cf has no `secret put` yet).
# It requires a real Synced Share GitHub OAuth App, which this pipeline
# does not create.

on:
  push:
    branches: [master]
    paths:
      - crates/live-share-worker/**
      - live-share-worker/migrations/**
      - .github/workflows/live-share-worker.yml
  workflow_dispatch:

concurrency:
  group: live-share-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Per AGENTS.md's "Local tooling" section: `worker-build` compiles
      # this `workers-rs` crate to the wasm bundle `cf` expects.
      - name: Install worker-build
        run: cargo install worker-build --locked

      - name: Build worker
        working-directory: crates/live-share-worker
        run: worker-build --release

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: crates/live-share-worker/package.json

      - name: Install cf
        working-directory: crates/live-share-worker
        run: pnpm install --frozen-lockfile

      # `cf d1 migrations apply` only applies migration files not yet
      # recorded as applied, so this is safe to run on every deploy even
      # though task 12 already applied the current migrations by hand.
      - name: Apply D1 migrations
        working-directory: crates/live-share-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec cf d1 migrations apply "$(jq -r .d1DatabaseId deploy.json)" --dir ../../live-share-worker/migrations

      - name: Deploy to Cloudflare Workers
        working-directory: crates/live-share-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec cf deploy
