name: Deploy Synced Share worker

# Deploys the Rust/D1 rewrite of the Synced Share worker
# (`crates/live-share-worker/`), replacing the old TypeScript/KV worker's
# now-deleted deploy pipeline (formerly `live-share-worker/`, see
# TODO-synced-share-rust-d1-migration.md task 11).
#
# Prerequisite not handled by this pipeline (TODO §7 / task 12): a deploy
# here will succeed, but GitHub sign-in stays broken until, once, by hand:
#   1. `SYNCED_SHARE_GITHUB_CLIENT_ID` in `crates/live-share-worker/wrangler.toml`
#      is filled in (still the `REPLACE_AT_ROLLOUT` placeholder), and
#   2. `SYNCED_SHARE_GITHUB_CLIENT_SECRET` is set via
#      `wrangler secret put SYNCED_SHARE_GITHUB_CLIENT_SECRET` from
#      `crates/live-share-worker/`.
# Both require a real Synced Share GitHub OAuth App, which this pipeline
# does not create.

on:
  push:
    branches: [master]
    paths:
      - crates/live-share-worker/**
      - live-share-worker/migrations/**
      - .github/workflows/live-share-worker.yml
  workflow_dispatch:

concurrency:
  group: live-share-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Per AGENTS.md's "Local tooling" section: `worker-build` compiles
      # this `workers-rs` crate to the wasm bundle `wrangler` expects.
      - name: Install worker-build
        run: cargo install worker-build --locked

      - name: Build worker
        working-directory: crates/live-share-worker
        run: worker-build --release

      # `wrangler d1 migrations apply` only applies migration files not yet
      # recorded as applied, so this is safe to run on every deploy even
      # though task 12 already applied the current migrations by hand.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: crates/live-share-worker
          command: d1 migrations apply jianpu-live-share --remote

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: crates/live-share-worker
          command: deploy
