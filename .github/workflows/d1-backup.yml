name: Back up production D1

# Daily SQL dump of the production D1 database into the private R2 bucket
# named by `backupBucket` in `crates/live-share-worker/deploy.json`. The
# bucket's lifecycle rules (`backup-lifecycle.json`, applied by
# `just setup-backup-bucket`) keep `daily/` for 30 days and `monthly/` (the
# 1st of each month's dump) for 365. `just restore-backup` loads one locally.
#
# BACKUP_CLOUDFLARE_API_TOKEN is its own token (D1 Edit + Workers R2 Storage
# Edit), not the deploy token. The worker has no binding to the bucket, so
# nothing it runs can touch the backups.

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: node pnpm

      - name: Install wrangler
        working-directory: crates/live-share-worker
        run: pnpm install --frozen-lockfile

      - name: Export and upload
        working-directory: crates/live-share-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BACKUP_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bucket=$(jq -r .backupBucket deploy.json)
          day=$(date -u +%F)
          pnpm exec wrangler d1 export jianpu-live-share --remote --output backup.sql
          gzip backup.sql
          pnpm exec wrangler r2 object put "$bucket/daily/$day.sql.gz" --remote --file backup.sql.gz --content-type application/gzip
          if [[ $(date -u +%d) == 01 ]]; then
            pnpm exec wrangler r2 object put "$bucket/monthly/$day.sql.gz" --remote --file backup.sql.gz --content-type application/gzip
          fi
