name: Deploy OAuth proxy to Cloudflare Pages

on:
  push:
    paths:
      - cf-oauth-proxy/**
      - .github/workflows/oauth-proxy.yml
  workflow_dispatch:

concurrency:
  group: oauth-proxy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cf-oauth-proxy/package.json

      - name: Install dependencies
        working-directory: cf-oauth-proxy
        run: npm install

      - name: Typecheck
        working-directory: cf-oauth-proxy
        run: npm run typecheck

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cf-oauth-proxy
          command: pages deploy public --project-name=jianpu-oauth-proxy
