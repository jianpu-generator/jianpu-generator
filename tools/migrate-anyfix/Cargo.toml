[package]
name = "migrate-anyfix"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "migrate-anyfix"
path = "src/main.rs"

[dependencies]
poentaro = { path = "../..", default-features = false }
# The same version as crates/live-share-worker: its `file_history` must be able
# to read the patches written here.
diffy = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
