# ts-rs bindings for `crates/live-share-worker`'s wire types, consumed by
# `web/` (regenerated by `web`'s `build:worker-types` script, gitignored).
[env]
TS_RS_EXPORT_DIR = { value = "web/src/generated/live-share-worker", relative = true }
# The worker's `i64` revisions/timestamps are JSON numbers, not bigints.
TS_RS_LARGE_INT = "number"
