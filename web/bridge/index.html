<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>簡譜 is now Poentaro</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        color: #1f2328;
        text-align: center;
      }
      main {
        max-width: 28rem;
        padding: 1.5rem;
      }
      button,
      a.button {
        font: inherit;
        padding: 0.5rem 1rem;
        margin: 0.25rem;
        border-radius: 6px;
        border: 1px solid #d0d7de;
        background: #f6f8fa;
        color: inherit;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>簡譜 is now Poentaro</h1>
      <p id="status">Moving you and your saved files to poentaro.pages.dev…</p>
      <div id="failure" hidden>
        <p id="failure-message"></p>
        <button id="retry" type="button">Try again</button>
        <a id="continue" class="button" href="https://poentaro.pages.dev"
          >Continue without my files</a
        >
        <p>Your files stay saved in this browser until they've moved.</p>
      </div>
    </main>
    <script type="module" src="./entry.ts"></script>
  </body>
</html>
