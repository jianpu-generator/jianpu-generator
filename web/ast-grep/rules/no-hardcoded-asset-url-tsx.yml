id: no-hardcoded-asset-url-tsx
language: tsx
severity: error
message: >-
  Hardcoded root-relative path inside a CSS url(...) string. Production
  serves this app under a non-root base path (VITE_BASE_PATH=/jianpu-generator/
  in .github/workflows/pages.yml), so a literal "/..." here resolves against
  the site root and 404s once deployed, even though it works fine against the
  dev server's root base. Interpolate `import.meta.env.BASE_URL` (or a
  `baseUrl` parameter sourced from it) in front of the path instead — see
  injectFontFaces.ts's `buildFontFaceCss` for the pattern.
note: >-
  Same rule as no-hardcoded-asset-url.yml, duplicated because ast-grep's
  `typescript` language only matches .ts/.mts/.cts files and `tsx` only
  matches .tsx files.
rule:
  kind: string_fragment
  regex: 'url\(\s*[\x22\x27\x60]/'
