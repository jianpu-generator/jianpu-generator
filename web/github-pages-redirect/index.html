<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>簡譜 is now Poentaro</title>
    <!-- GitHub Pages' old copy of the app (`/jianpu-generator/`) only
         redirects: the same link on poentaro.pages.dev, minus the base path,
         keeping the query and fragment that share links carry. Unlike the
         Cloudflare bridge (`web/bridge/`), it does not carry saved files
         over. Deployed as `index.html` and `404.html` by
         `.github/workflows/pages.yml`. -->
    <script>
      ;(() => {
        const base = '/jianpu-generator/'
        const path = location.pathname.startsWith(base)
          ? `/${location.pathname.slice(base.length)}`
          : location.pathname
        location.replace(
          `https://poentaro.pages.dev${path}${location.search}${location.hash}`,
        )
      })()
    </script>
  </head>
  <body>
    <p>
      簡譜 is now <a href="https://poentaro.pages.dev/">Poentaro</a>.
    </p>
  </body>
</html>
